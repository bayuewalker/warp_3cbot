# Set actual app name during deployment with `fly deploy --app <name>`.
primary_region = "sin"

[env]
  PORT = "8080"
  WARP_DB_PATH = "/data/warp.db"
  WARP_CYCLE_SECONDS = "900"
  TRADING_MODE = "observe"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "warp_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "180s"
  method = "GET"
  path = "/health"
