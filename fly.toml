# Set the app name at deploy time: `fly deploy --app <name> --ha=false`.
# Keep exactly one Machine. Fly will not create extra Machines by itself;
# do not run `fly scale count` above 1. The volume attaches to one Machine.
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = 30

[env]
  PORT = "8080"
  WARP_DB_PATH = "/data/warp.db"
  WARP_CYCLE_SECONDS = "900"
  TRADING_MODE = "observe"
  WARP_MANAGE_VIBE = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "180s"
    method = "GET"
    path = "/live"

[[mounts]]
  source = "warp_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

[[restart]]
  policy = "always"
  retries = 10
