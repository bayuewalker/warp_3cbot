name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker
        run: pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
